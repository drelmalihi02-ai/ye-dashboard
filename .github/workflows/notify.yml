name: Post update to Telegram
on:
  push:
    branches: [main]
    paths: [notice.txt]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send text-only digest
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.CHANNEL_ID }}
        run: |
          API="https://api.telegram.org/bot${TOKEN}"
          # Text only: no images, maps or link previews.
          curl -sS --fail "$API/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text@notice.txt" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" > /dev/null
