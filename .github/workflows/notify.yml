name: Post update to Telegram
on:
  push:
    branches: [main]
    paths: [notice.txt]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send notice
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.CHANNEL_ID }}
        run: |
          curl -sS --fail "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text@notice.txt" \
            -d "disable_web_page_preview=false" > /dev/null
