name: Post update to Telegram
on:
  push:
    branches: [main]
    paths: [notice.txt]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to post: text (the digest), weekly (the weekly snapshot card) or both"
        type: choice
        options: [text, weekly, both]
        default: text
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide what to post
        id: what
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Digest pushes post text only. The Sunday weekly card was replaced by the weekly SITREP
            # (sitrep.yml, Sundays 08:00 Sana'a) at the user's request on 25 Oct 2026.
            MODE=text
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Send notice (text only)
        if: steps.what.outputs.mode != 'weekly'
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.CHANNEL_ID }}
        run: |
          curl -sS --fail "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text@notice.txt" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" > /dev/null
      - name: Send weekly snapshot (photo with caption)
        if: steps.what.outputs.mode != 'text' && hashFiles('weekly.png') != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.CHANNEL_ID }}
        run: |
          curl -sS --fail "https://api.telegram.org/bot${TOKEN}/sendPhoto" \
            --form-string "chat_id=${CHAT}" \
            -F "photo=@weekly.png" \
            -F "caption=<weekly_caption.txt" \
            --form-string "parse_mode=HTML" > /dev/null
